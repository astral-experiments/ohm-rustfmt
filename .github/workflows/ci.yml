name: CI

on:
  push:
    branches: [ohm-1.97.1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: nightly-2026-02-19

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component rustc-dev \
            --component llvm-tools \
            --component rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.release-channel }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        release-channel: [nightly, stable]
    env:
      CFG_RELEASE_CHANNEL: ${{ matrix.release-channel }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component rustc-dev \
            --component llvm-tools \
            --component rustfmt
      - name: Build and test rustfmt, config_proc_macro, and check_diff
        run: ./ci/build_and_test.sh

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: >-
        --document-private-items --enable-index-page --show-type-layout
        --generate-link-to-definition -Zunstable-options -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component rustc-dev \
            --component llvm-tools \
            --component rustfmt
      - name: Build documentation without warnings
        run: cargo doc -Zskip-rustdoc-fingerprint --no-deps -p rustfmt-nightly -p rustfmt-config_proc_macro

name: CI

on:
  push:
    branches: [ohm-1.97.1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.97.1
  RUSTC_BOOTSTRAP: "1"

jobs:
  format:
    name: Format
    runs-on: depot-ubuntu-24.04-4
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-02-19
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" \
            --profile minimal \
            --component rustc-dev \
            --component llvm-tools \
            --component rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.release-channel }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [depot-ubuntu-24.04-16, depot-macos-15]
        release-channel: [nightly, stable]
        include:
          - os: depot-ubuntu-24.04-16
            runner: depot-ubuntu-24.04-16
          - os: depot-macos-15
            runner: namespace-profile-macos-15
    env:
      CFG_RELEASE_CHANNEL: ${{ matrix.release-channel }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" \
            --profile minimal \
            --component rustc-dev \
            --component llvm-tools \
            --component rustfmt
      - name: Build and test rustfmt, config_proc_macro, and check_diff
        run: ./ci/build_and_test.sh

  rustdoc:
    name: Rustdoc
    runs-on: depot-ubuntu-24.04-4
    env:
      RUSTDOCFLAGS: >-
        --document-private-items --enable-index-page --show-type-layout
        --generate-link-to-definition -Zunstable-options -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" \
            --profile minimal \
            --component rustc-dev \
            --component llvm-tools \
            --component rustfmt
      - name: Build documentation without warnings
        run: cargo doc --locked --no-deps -p rustfmt-nightly -p rustfmt-config_proc_macro

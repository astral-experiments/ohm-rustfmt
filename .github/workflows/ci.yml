name: CI

on:
  push:
    branches: [ohm-1.99.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  RUSTC_BOOTSTRAP: "1"

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-19
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" \
            --profile minimal \
            --component rustc-dev \
            --component llvm-tools \
            --component rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.release-channel }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [depot-ubuntu-24.04-16, depot-macos-15]
        release-channel: [nightly, stable]
        include:
          - os: depot-ubuntu-24.04-16
            runner: namespace-profile-ubuntu-24-04-16
          - os: depot-macos-15
            runner: namespace-profile-macos-15
    env:
      CFG_RELEASE_CHANNEL: ${{ matrix.release-channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" \
            --profile minimal \
            --component rustc-dev \
            --component llvm-tools \
            --component rustfmt
      - name: Build and test rustfmt, config_proc_macro, and check_diff
        env:
          RUSTFLAGS: -D warnings
        run: cargo run --locked --manifest-path ci/Cargo.toml build-and-test
      - name: Check dev-channel formatting fixtures
        if: runner.os == 'Linux' && matrix.release-channel == 'stable'
        env:
          CFG_RELEASE_CHANNEL: dev
          RUSTFLAGS: -D warnings
        run: cargo test --locked --lib test::system_tests -- --exact

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: >-
        --document-private-items --enable-index-page --show-type-layout
        --generate-link-to-definition -Zunstable-options -Dwarnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" \
            --profile minimal \
            --component rustc-dev \
            --component llvm-tools \
            --component rustfmt
      - name: Build documentation without warnings
        run: cargo doc --locked --no-deps -p rustfmt-nightly -p rustfmt-config_proc_macro
